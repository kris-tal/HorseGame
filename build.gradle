subprojects {
  apply plugin: "java"

  java {
    sourceCompatibility = JavaVersion.VERSION_21
  }

  repositories {
    mavenCentral()
      mavenLocal()
  }

  ext {
    gdxVersion = '1.12.1'
  }

  dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  }

  test {
    useJUnitPlatform()
      testLogging {
        events "passed", "skipped", "failed"
      }
  }
}
