version: "3.9"

services:
  web:
    build: .
    container_name: kontra_web
    ports:
      - "5000:5000"
    environment:
      - JWT_SECRET_KEY=devsecret
      - DATABASE_URL=sqlite:////data/dev.db
      - FLASK_ENV=development
    volumes:
      - .:/app
      - dbdata:/data

volumes:
  dbdata:
